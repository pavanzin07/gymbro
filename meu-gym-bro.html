<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0f12">
<title>MEU GYM BRO</title>
<style>
  :root{
    --bg:#0d0f12; --bg2:#15181d; --card:#1b1f26; --card2:#222730;
    --line:#2a313b; --txt:#e8edf2; --mut:#8b95a3; --acc:#c6ff3a;
    --acc2:#9cff00; --warn:#ff5c5c; --blue:#4aa8ff; --orange:#ff9f43;
    --prot:#4aa8ff; --carb:#ffb13a; --fat:#ff6b9d; --shadow:0 8px 30px rgba(0,0,0,.45);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#1a2210 0%,transparent 55%),var(--bg);
    color:var(--txt);line-height:1.45;padding-bottom:90px;
  }
  ::selection{background:var(--acc);color:#000}
  /* HEADER */
  header{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(13,15,18,.96),rgba(13,15,18,.82));
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:14px 18px;display:flex;align-items:center;gap:12px;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.5px}
  .logo .mark{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0a0a;
    font-size:20px;box-shadow:0 4px 14px rgba(156,255,0,.35);
  }
  .logo h1{font-size:18px;line-height:1}
  .logo small{display:block;font-size:10px;color:var(--mut);font-weight:600;letter-spacing:2px}
  .spacer{flex:1}
  .icon-btn{
    background:var(--card);border:1px solid var(--line);color:var(--mut);
    width:40px;height:40px;border-radius:11px;font-size:18px;cursor:pointer;
    display:grid;place-items:center;transition:.15s;
  }
  .icon-btn:hover{color:var(--acc);border-color:var(--acc)}
  /* CONTAINER */
  main{max-width:680px;margin:0 auto;padding:18px 18px 118px}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* SECTION HEAD */
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
  .sec-head h2{font-size:22px;font-weight:800}
  .sec-head p{color:var(--mut);font-size:13px;margin-top:2px}
  /* BUTTONS */
  .btn{
    border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;
    padding:11px 16px;transition:.15s;display:inline-flex;align-items:center;gap:7px;
  }
  .btn-acc{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0a0a}
  .btn-acc:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn-ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--acc);color:var(--acc)}
  .btn-sm{padding:7px 11px;font-size:13px;border-radius:10px}
  .btn-danger{background:transparent;color:var(--warn);border:1px solid transparent}
  .btn-danger:hover{border-color:var(--warn)}
  /* CARDS */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .routine-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .routine-head .tag{
    background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0a0a;
    font-weight:900;font-size:13px;width:34px;height:34px;border-radius:9px;
    display:grid;place-items:center;flex:none;
  }
  .routine-head h3{font-size:17px;font-weight:800;flex:1}
  .routine-meta{color:var(--mut);font-size:12px;margin-bottom:12px}
  /* EXERCISE / FOOD ROW */
  .row{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
    background:var(--card2);border:1px solid transparent;margin-bottom:8px;transition:.15s;
  }
  .row:hover{border-color:var(--line)}
  .row .name{flex:1;min-width:0}
  .row .name b{font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .name span{color:var(--mut);font-size:12px}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{
    background:var(--bg2);border:1px solid var(--line);border-radius:8px;
    padding:3px 8px;font-size:12px;font-weight:700;color:var(--txt);white-space:nowrap;
  }
  .pill.dim{color:var(--mut);font-weight:600}
  .row-actions{display:flex;gap:4px;flex:none}
  .mini{
    background:transparent;border:none;color:var(--mut);cursor:pointer;font-size:15px;
    width:30px;height:30px;border-radius:8px;display:grid;place-items:center;transition:.15s;
  }
  .mini:hover{background:var(--bg2);color:var(--acc)}
  .mini.del:hover{color:var(--warn)}
  .add-line{margin-top:6px}
  /* EMPTY */
  .empty{
    text-align:center;padding:48px 20px;color:var(--mut);
    border:2px dashed var(--line);border-radius:var(--radius);
  }
  .empty .big{font-size:42px;margin-bottom:10px;filter:grayscale(.2)}
  .empty p{margin-bottom:16px;font-size:14px}
  /* MACRO TARGETS */
  .macro-card{background:linear-gradient(135deg,#1d2230,#171b22)}
  .macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .macro-box{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:11px 10px;text-align:center}
  .macro-box .lbl{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .macro-box .val{font-size:19px;font-weight:900;margin-top:3px}
  .macro-box .val small{font-size:11px;color:var(--mut);font-weight:600}
  .macro-box.kcal .val{color:var(--acc)}
  .macro-box.prot .val{color:var(--prot)}
  .macro-box.carb .val{color:var(--carb)}
  .macro-box.fat .val{color:var(--fat)}
  .bar{height:6px;border-radius:4px;background:var(--bg2);margin-top:8px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
  .meal-total{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;margin-bottom:10px}
  .meal-total .pill{background:var(--bg2)}
  /* MODAL */
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);
    z-index:100;display:none;align-items:flex-end;justify-content:center;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:var(--bg2);border:1px solid var(--line);border-top-left-radius:22px;
    border-top-right-radius:22px;width:100%;max-width:680px;padding:22px 20px 26px;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:slideup .25s ease;max-height:90vh;overflow-y:auto;
  }
  @media(min-width:680px){
    .modal-bg{align-items:center}
    .modal{border-radius:22px;animation:fade .2s ease}
  }
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .modal h3{font-size:19px;margin-bottom:4px}
  .modal .sub{color:var(--mut);font-size:13px;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .field input,.field select,.field textarea{
    width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:12px 13px;font-size:15px;font-family:inherit;transition:.15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(198,255,58,.12)}
  .field textarea{resize:vertical;min-height:60px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:10px;margin-top:22px}
  .modal-actions .btn{flex:1;justify-content:center;padding:13px}
  .hint{font-size:11px;color:var(--mut);margin-top:5px}
  /* BOTTOM NAV */
  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:linear-gradient(0deg,rgba(13,15,18,.98),rgba(13,15,18,.9));
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1;max-width:160px;background:none;border:none;color:var(--mut);cursor:pointer;
    padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;
    gap:3px;font-size:11px;font-weight:700;transition:.15s;
  }
  .tab .ic{font-size:21px;line-height:1}
  .tab.active{color:var(--acc)}
  .tab.active .ic{transform:translateY(-1px)}
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--acc);color:#0a0a0a;font-weight:800;font-size:13.5px;padding:11px 20px;
    border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:200;opacity:0;
    pointer-events:none;transition:.3s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .week-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .week-pick button{
    background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:9px;
    padding:7px 10px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;flex:1;
  }
  .week-pick button.on{background:var(--acc);color:#0a0a0a;border-color:var(--acc)}
  /* PERFIL / SUGESTÕES */
  .why{
    background:rgba(74,168,255,.08);border:1px solid rgba(74,168,255,.25);
    border-radius:12px;padding:11px 13px;font-size:12.5px;color:#bcd6f0;margin:10px 0 14px;line-height:1.5;
  }
  .why b{color:#dcebff;color:#cfe4ff}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
  .stat .v{font-size:18px;font-weight:900}
  .stat .l{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  .sug-block{margin-bottom:18px}
  .sug-block > .title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:3px}
  .sug-block > .desc{color:var(--mut);font-size:12.5px;margin-bottom:11px}
  .opt{
    display:flex;align-items:center;gap:12px;background:var(--card2);border:2px solid var(--line);
    border-radius:13px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative;
  }
  .opt:hover{border-color:var(--mut)}
  .opt.sel{border-color:var(--acc);background:linear-gradient(135deg,rgba(198,255,58,.10),var(--card2))}
  .opt .radio{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center;transition:.15s;
  }
  .opt.sel .radio{border-color:var(--acc)}
  .opt.sel .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--acc)}
  .opt .o-main{flex:1;min-width:0}
  .opt .o-main .o-name{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .opt .o-main .o-sub{color:var(--mut);font-size:12px;margin-top:2px}
  .opt .o-val{text-align:right;flex:none}
  .opt .o-val .big{font-weight:900;font-size:16px}
  .opt .o-val .unit{font-size:11px;color:var(--mut)}
  .rec{
    font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:20px;
    background:var(--bg2);color:var(--mut);border:1px solid var(--line);white-space:nowrap;
  }
  .rec.hi{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0a0a;border-color:transparent}
  .rec.mid{background:rgba(198,255,58,.15);color:var(--acc);border-color:rgba(198,255,58,.3)}
  .badge-best{
    position:absolute;top:-9px;right:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    color:#0a0a0a;font-size:9.5px;font-weight:900;padding:2px 8px;border-radius:20px;letter-spacing:.5px;
  }
  .profile-cta{text-align:center;padding:30px 20px}
  .profile-cta .big{font-size:46px;margin-bottom:12px}
  .profile-cta h3{font-size:19px;margin-bottom:8px}
  .profile-cta p{color:var(--mut);font-size:14px;margin-bottom:20px;line-height:1.55}
  .chip-pick{display:flex;flex-wrap:wrap;gap:7px}
  .chip-pick button{
    background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:20px;
    padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .chip-pick button.on{background:var(--acc);color:#0a0a0a;border-color:var(--acc);font-weight:800}
  .applied-note{display:flex;align-items:center;gap:8px;background:rgba(198,255,58,.1);border:1px solid rgba(198,255,58,.3);border-radius:11px;padding:10px 12px;font-size:12.5px;color:var(--acc);font-weight:600;margin-top:6px}
  .quick-foods{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:160px;overflow-y:auto}
  .quick-foods button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:6px 10px;font-size:12.5px;cursor:pointer;transition:.15s}
  .quick-foods button:hover{border-color:var(--acc);color:var(--acc)}
  /* PROGRESSO */
  .big-num{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
  .big-num .n{font-size:34px;font-weight:900;line-height:1}
  .big-num .u{font-size:14px;color:var(--mut);font-weight:700}
  .delta{font-size:13px;font-weight:800;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
  .delta.up{background:rgba(198,255,58,.15);color:var(--acc)}
  .delta.down{background:rgba(74,168,255,.15);color:var(--blue)}
  .delta.flat{background:var(--bg2);color:var(--mut)}
  .chart-wrap{margin-top:14px;background:var(--bg2);border-radius:12px;padding:12px 6px 6px}
  .chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
  .chart-empty{text-align:center;color:var(--mut);font-size:13px;padding:26px 10px}
  .water-row{display:flex;align-items:center;gap:14px;margin-top:6px}
  .water-cups{display:flex;gap:5px;flex-wrap:wrap;flex:1}
  .cup{width:26px;height:32px;border-radius:5px 5px 8px 8px;border:2px solid var(--line);background:var(--card2);cursor:pointer;transition:.15s;position:relative}
  .cup.on{background:linear-gradient(180deg,#4aa8ff,#2d7fd0);border-color:#4aa8ff}
  .water-ctrl{display:flex;align-items:center;gap:8px}
  .round-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:20px;font-weight:800;cursor:pointer;transition:.15s;display:grid;place-items:center}
  .round-btn:hover{border-color:var(--acc);color:var(--acc)}
  .habit-toggles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .htog{display:flex;align-items:center;gap:10px;background:var(--card2);border:2px solid var(--line);border-radius:13px;padding:12px;cursor:pointer;transition:.15s}
  .htog.on{border-color:var(--acc);background:linear-gradient(135deg,rgba(198,255,58,.1),var(--card2))}
  .htog .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);flex:none;display:grid;place-items:center;font-size:14px;color:#0a0a0a;transition:.15s}
  .htog.on .ck{background:var(--acc);border-color:var(--acc)}
  .htog .lab{font-size:13px;font-weight:700;line-height:1.2}
  .htog .lab small{display:block;color:var(--mut);font-weight:600;font-size:11px}
  .streak{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2a1f10,#1a1510);border:1px solid #4a3a1a;border-radius:13px;padding:13px 15px;margin-top:14px}
  .streak .fire{font-size:30px}
  .streak .s-txt b{font-size:20px;color:var(--orange)}
  .streak .s-txt div{font-size:12.5px;color:var(--mut)}
  .seg{display:flex;gap:6px;margin:2px 0 14px;background:var(--card2);padding:4px;border-radius:11px}
  .seg button{flex:1;background:none;border:none;color:var(--mut);font-weight:700;font-size:13px;padding:8px;border-radius:8px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--acc);color:#0a0a0a}
  .hist-dots{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
  .hdot{width:13px;height:13px;border-radius:4px;background:var(--card2);border:1px solid var(--line)}
  .hdot.w{background:#3a7a3a;border-color:#4a9a4a}
  .hdot.d{background:#3a5a8a;border-color:#4a7aba}
  .hdot.wd{background:linear-gradient(135deg,#4a9a4a,#4a7aba);border-color:var(--acc)}
  /* PERSONAGEM */
  .tab{padding:7px 2px}
  .tab .ic{font-size:19px}
  .tab span:last-child{font-size:10px}
  .avatar-stage{display:flex;justify-content:center;padding:6px 0 2px;background:radial-gradient(120px 120px at 50% 35%,rgba(198,255,58,.10),transparent 70%)}
  .avatar-stage svg{width:200px;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
  .lvl-row{display:flex;align-items:center;gap:12px;margin-top:8px}
  .lvl-badge{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0a0a;display:grid;place-items:center;flex:none;font-weight:900;line-height:1}
  .lvl-badge small{font-size:8px;display:block;letter-spacing:1px}
  .lvl-badge b{font-size:20px}
  .lvl-info{flex:1}
  .lvl-info .nm{font-weight:800;font-size:16px}
  .xpbar{height:9px;border-radius:5px;background:var(--bg2);margin-top:5px;overflow:hidden}
  .xpbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:5px;transition:width .5s}
  .coins{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#2a1f10,#1a1510);border:1px solid #4a3a1a;border-radius:12px;padding:9px 13px;font-weight:900;color:var(--orange);font-size:16px;white-space:nowrap}
  .stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .stat-row .ico{font-size:18px;width:24px;text-align:center;flex:none}
  .stat-row .nm{font-size:13px;font-weight:700;width:118px;flex:none}
  .stat-row .track{flex:1;height:10px;border-radius:6px;background:var(--bg2);overflow:hidden}
  .stat-row .track > i{display:block;height:100%;border-radius:6px;transition:width .6s}
  .stat-row .v{font-size:13px;font-weight:900;width:26px;text-align:right;flex:none}
  .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .shop-item{background:var(--card2);border:2px solid var(--line);border-radius:13px;padding:12px;text-align:center;transition:.15s;cursor:pointer}
  .shop-item.equipped{border-color:var(--acc);background:linear-gradient(135deg,rgba(198,255,58,.1),var(--card2))}
  .shop-item.owned{border-color:var(--mut)}
  .shop-item .em{font-size:26px}
  .shop-item .nm{font-size:12.5px;font-weight:700;margin:5px 0 7px;line-height:1.2;min-height:30px;display:flex;align-items:center;justify-content:center}
  .shop-item .act{font-size:11.5px;font-weight:800;padding:5px 8px;border-radius:8px}
  .shop-item .act.buy{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0a0a}
  .shop-item .act.buy.no{background:var(--bg2);color:var(--mut)}
  .shop-item .act.eq{background:var(--acc);color:#0a0a0a}
  .shop-item .act.own{background:var(--bg2);color:var(--txt)}
  .slot-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .slot-tabs button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
  .slot-tabs button.on{background:var(--acc);color:#0a0a0a;border-color:var(--acc)}
  .skin-pick{display:flex;gap:8px;margin-top:6px}
  .skin-pick button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
  .skin-pick button.on{border-color:var(--acc);transform:scale(1.1)}
  .class-banner{text-align:center;font-weight:900;font-size:14px;letter-spacing:.5px;
    background:linear-gradient(90deg,transparent,rgba(198,255,58,.14),transparent);
    color:var(--acc);padding:7px;border-radius:10px;margin-bottom:2px;text-transform:uppercase}
  .power{font-size:13px;font-weight:900;color:var(--orange);background:rgba(255,159,67,.12);
    border:1px solid rgba(255,159,67,.3);border-radius:20px;padding:4px 11px;white-space:nowrap}
  .shop-item{position:relative}
  .shop-item .rar{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
  .ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .ach{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 9px;text-align:center;opacity:.55}
  .ach.on{opacity:1;border-color:rgba(255,159,67,.4);background:linear-gradient(135deg,rgba(255,159,67,.1),var(--card2))}
  .ach-em{font-size:26px}
  .ach-n{font-size:12.5px;font-weight:800;margin:4px 0 3px}
  .ach-r{font-size:10.5px;color:var(--mut);line-height:1.25}
  .ach.on .ach-r{color:var(--orange);font-weight:700}
  .roster{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .rchip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
  .rchip.on{background:var(--acc);color:#0a0a0a;border-color:var(--acc)}
  .rchip.add{color:var(--acc);border-style:dashed}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="mark">💪</div>
    <div><h1>MEU GYM BRO</h1><small>TREINO · DIETA</small></div>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" onclick="openMenu()" title="Opções">⚙️</button>
</header>

<main>
  <!-- ===== PERFIL ===== -->
  <section id="view-perfil" class="view active">
    <div class="sec-head">
      <div>
        <h2>Seu perfil</h2>
        <p id="perfil-sub">Conte sobre você pra começar</p>
      </div>
    </div>
    <div id="perfil-body"></div>

  <!-- ===== TREINOS ===== -->
  <section id="view-treino" class="view">

      <div>
        <h2>Treinos</h2>
        <p id="treino-sub">Monte suas rotinas</p>
      </div>
      <button class="btn btn-acc" onclick="openRoutine()">＋ Treino</button>
    </div>
    <div id="routines"></div>
  </section>

  <!-- ===== PROGRESSO ===== -->
  <section id="view-progresso" class="view">

      </div>
    </div>
    <div id="prog-body"></div>
  </section>

  <!-- ===== PERSONAGEM ===== -->
  <section id="view-bro" class="view">
    <div class="sec-head">
      <div>
        <h2>Seu Bro</h2>
        <p id="bro-sub">Evolua treinando</p>
      </div>
    </div>
    <div id="bro-body"></div>
  </section>

  <!-- ===== RECORDES ===== -->
  <section id="view-recordes" class="view">
    <div class="sec-head">
      <div>
        <h2>Conquistas</h2>
        <p id="rec-sub">Metas, conquistas e recordes</p>
      </div>
    </div>
    <div id="rec-body"></div>

  <!-- ===== ALIMENTAÇÃO ===== -->
  <section id="view-dieta" class="view">
    <div class="sec-head">
      <div>

        <p id="dieta-sub">Planeje suas refeições</p>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="reviewDiet()">🔍 Revisão</button>
        <button class="btn btn-ghost btn-sm" onclick="openTargets()">🎯 Metas</button>
      </div>
    </div>
    <div id="macro-summary"></div>
    <div id="meals"></div>
    <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:4px" onclick="openMeal()">＋ Nova refeição</button>
  </section>
</main>

<!-- BOTTOM NAV -->
<nav class="tabbar">
  <button class="tab active" id="tab-perfil" onclick="go('perfil')">
    <span class="ic">🧬</span><span>Perfil</span>
  </button>
  <button class="tab" id="tab-treino" onclick="go('treino')">
    <span class="ic">🏋️</span><span>Treino</span>
  </button>
  <button class="tab" id="tab-recordes" onclick="go('recordes')">
    <span class="ic">🏆</span><span>Conquistas</span>
  </button>
  <button class="tab" id="tab-dieta" onclick="go('dieta')">
    <span class="ic">🍽️</span><span>Dieta</span>
  </button>
  <button class="tab" id="tab-progresso" onclick="go('progresso')">
    <span class="ic">📈</span><span>Progresso</span>
  </button>
  <button class="tab" id="tab-bro" onclick="go('bro')">
    <span class="ic">🦾</span><span>Bro</span>
  </button>
</nav>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ STATE ============ */
const KEY='meu_gym_bro_v1';
const DEFAULT={
  profile:null, // {sex,age,height,weight,goal,level,months,trainDays,otherSport,otherDays,lifestyle}
  choices:{kcal:'b',prot:'b',fat:'b'}, // qual opção a pessoa escolheu
  progress:{ weight:[], measures:[], waterGoalMl:2000, days:{} }, // evolução
  sessions:[], // treinos registrados dia a dia
  goals:[], // metas do usuário
  characters:[], // vários personagens
  activeChar:0,
  wallet:{owned:['short_black'],spent:0}, // moedas/itens compartilhados
  routines:[],
  meals:[
    {id:uid(),name:'Café da manhã',foods:[]},
    {id:uid(),name:'Almoço',foods:[]},
    {id:uid(),name:'Lanche',foods:[]},
    {id:uid(),name:'Jantar',foods:[]}
  ],
  targets:{kcal:2200,prot:160,carb:230,fat:70}
};
let S=load();

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.routines){
      if(r.profile===undefined)r.profile=null;
      if(!r.choices)r.choices={kcal:'b',prot:'b',fat:'b'};
      if(!r.progress)r.progress={weight:[],measures:[],waterGoalMl:2000,days:{}};
      if(!r.progress.waterGoalMl)r.progress.waterGoalMl=(r.progress.waterGoal||8)*250;
      if(!r.character)r.character={created:false,sex:'M',skin:1,hair:0,hairStyle:'curto',name:'',spent:0,owned:['short_black'],equipped:{head:null,neck:null,wrists:null,hands:null,belt:null,top:null,bottom:'short_black',feet:null}};
      if(!r.wallet)r.wallet={owned:(r.character&&r.character.owned)||['short_black'],spent:(r.character&&r.character.spent)||0};
      if(!r.characters){
        if(r.character&&r.character.created){const c=r.character;
          r.characters=[{name:c.name||'Meu Bro',race:c.race||'humano',sex:c.sex||'M',skin:c.skin!=null?c.skin:1,hair:c.hair||0,hairStyle:c.hairStyle||'curto',equipped:c.equipped||{}}];}
        else r.characters=[];
        r.activeChar=0;
      }
      r.characters.forEach(c=>{if(!c.equipped)c.equipped={};['head','neck','wrists','hands','belt','top','bottom','feet','cape'].forEach(s=>{if(c.equipped[s]===undefined)c.equipped[s]=s==='bottom'?'short_black':null;});});
      if(r.activeChar==null||r.activeChar>=r.characters.length)r.activeChar=0;
      if(!r.sessions)r.sessions=[];
      if(!r.goals)r.goals=[];
      return r;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n}

/* ============ NAV ============ */
function go(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('tab-'+v).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============ TOAST ============ */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);
}

/* ============ MODAL ============ */
function showModal(html){
  document.getElementById('modal').innerHTML=html;
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('show')}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal()});

/* ============ TREINOS ============ */
const LETTERS='ABCDEFGHIJ';
function renderRoutines(){
  const box=document.getElementById('routines');
  const sub=document.getElementById('treino-sub');
  if(!S.routines.length){
    if(S.profile){
      sub.textContent='Comece escolhendo uma divisão';
      box.innerHTML=`<div class="card">
        <b style="font-size:15px">💡 Sugestões de divisão pro seu perfil</b>
        <div style="color:var(--mut);font-size:12.5px;margin:4px 0 14px">Não sabe como dividir o treino? Escolha uma opção abaixo — a gente cria a estrutura com o que cada dia treina, e você preenche os exercícios (com sugestões prontas).</div>
        ${splitCardsHTML()}
      </div>
      <button class="btn btn-ghost" style="width:100%;justify-content:center" onclick="openRoutine()">＋ Ou criar um treino do zero</button>`;
    }else{
      sub.textContent='Monte suas rotinas';
      box.innerHTML=`<div class="empty"><div class="big">🏋️</div>
        <p>Pra te sugerir a melhor divisão (peito/tríceps, pull, perna...),<br>preencha seu perfil primeiro.</p>
        <button class="btn btn-acc" style="margin:0 auto 10px" onclick="go('perfil')">Preencher perfil</button>
        <button class="btn btn-ghost" style="margin:0 auto" onclick="openRoutine()">Criar treino do zero</button></div>`;
    }
    return;
  }
  const totalEx=S.routines.reduce((a,r)=>a+r.exercises.length,0);
  sub.textContent=`${S.routines.length} treino${S.routines.length>1?'s':''} · ${totalEx} exercício${totalEx!==1?'s':''}`;
  box.innerHTML=sessionTodayCardHTML()+S.routines.map((r,i)=>{
    const exs=r.exercises.map(ex=>{
      const pr=exPR(ex);
      return `
      <div class="row">
        <div class="name"><b>${esc(ex.name)}</b>
          ${ex.note?`<span>${esc(ex.note)}</span>`:''}</div>
        <div class="pills">
          <span class="pill">${ex.sets}×${esc(ex.reps)}</span>
          ${num(ex.load)>0?`<span class="pill">${esc(ex.load)} kg</span>`:''}
          ${pr?`<span class="pill" style="color:var(--orange)">🏆 ${pr.load}kg</span>`:''}
        </div>
        <div class="row-actions">
          <button class="mini" onclick="logSet('${r.id}','${ex.id}')" title="Registrar carga">📈</button>
          <button class="mini" onclick="openExercise('${r.id}','${ex.id}')">✏️</button>
          <button class="mini del" onclick="delExercise('${r.id}','${ex.id}')">🗑</button>
        </div>
      </div>`;}).join('');
    return `<div class="card">
      <div class="routine-head">
        <div class="tag">${esc(r.label||LETTERS[i]||'•')}</div>
        <h3>${esc(r.name)}</h3>
        <button class="mini" onclick="openRoutine('${r.id}')">✏️</button>
        <button class="mini del" onclick="delRoutine('${r.id}')">🗑</button>
      </div>
      ${r.focus?`<div class="routine-meta">🎯 ${esc(r.focus)}</div>`:''}
      ${exs||'<div class="routine-meta" style="margin-top:6px">Sem exercícios ainda.</div>'}
      <div class="add-line" style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="openExercise('${r.id}')">＋ Exercício</button>
        <button class="btn btn-ghost btn-sm" onclick="suggestExercises('${r.id}')">💡 Sugestões</button>
      </div>
    </div>`;
  }).join('')
  + `<button class="btn btn-acc" style="width:100%;justify-content:center;margin-top:4px" onclick="reviewWorkout()">🔍 Pedir revisão do treino</button>`
  + sessionHistoryHTML();
}

function openRoutine(id){
  const r=id?S.routines.find(x=>x.id===id):null;
  const nextLabel=LETTERS[S.routines.length]||'';
  showModal(`
    <h3>${r?'Editar treino':'Novo treino'}</h3>
    <p class="sub">Ex: Treino A — Peito e Tríceps</p>
    <div class="field"><label>Nome do treino</label>
      <input id="r-name" placeholder="Treino A" value="${r?esc(r.name):''}"></div>
    <div class="grid2">
      <div class="field"><label>Letra / dia</label>
        <input id="r-label" maxlength="6" placeholder="A" value="${r?esc(r.label||''):nextLabel}"></div>
      <div class="field"><label>Foco muscular</label>
        <input id="r-focus" placeholder="Peito, Tríceps" value="${r?esc(r.focus||''):''}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-acc" onclick="saveRoutine('${id||''}')">Salvar</button>
    </div>`);
  setTimeout(()=>document.getElementById('r-name').focus(),100);
}
function saveRoutine(id){
  const name=document.getElementById('r-name').value.trim();
  if(!name){toast('Dá um nome pro treino 💪');return}
  const label=document.getElementById('r-label').value.trim();
  const focus=document.getElementById('r-focus').value.trim();
  if(id){const r=S.routines.find(x=>x.id===id);r.name=name;r.label=label;r.focus=focus;}
  else{S.routines.push({id:uid(),name,label,focus,exercises:[],created:Date.now()});}
  save();renderRoutines();closeModal();toast('Treino salvo ✅');
}
function delRoutine(id){
  const r=S.routines.find(x=>x.id===id);
  if(!confirm(`Apagar o treino "${r.name}"?`))return;
  S.routines=S.routines.filter(x=>x.id!==id);save();renderRoutines();toast('Treino removido');
}

function openExercise(rid,eid){
  const r=S.routines.find(x=>x.id===rid);
  const ex=eid?r.exercises.find(x=>x.id===eid):null;
  showModal(`
    <h3>${ex?'Editar exercício':'Novo exercício'}</h3>
    <p class="sub">${esc(r.name)}</p>
    <div class="field"><label>Exercício</label>
      <input id="e-name" placeholder="Supino reto" value="${ex?esc(ex.name):''}"></div>
    <div class="field"><label>Grupo muscular</label>
      <select id="e-musc">
        ${['Peito','Costas','Pernas','Ombro','Bíceps','Tríceps','Core','Outro']
          .map(g=>`<option ${ex&&ex.musc===g?'selected':''}>${g}</option>`).join('')}
      </select></div>
    <div class="grid2">
      <div class="field"><label>Séries</label>
        <input id="e-sets" type="number" inputmode="numeric" placeholder="4" value="${ex?esc(ex.sets):''}"></div>
      <div class="field"><label>Repetições</label>
        <input id="e-reps" placeholder="8-12" value="${ex?esc(ex.reps):''}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Carga (kg)</label>
        <input id="e-load" type="number" inputmode="decimal" step="0.5" placeholder="40" value="${ex?esc(ex.load):''}"></div>
      <div class="field"><label>Descanso (s)</label>
        <input id="e-rest" type="number" inputmode="numeric" placeholder="90" value="${ex?esc(ex.rest):''}"></div>
    </div>
    <div class="field"><label>Observação</label>
      <input id="e-note" placeholder="Cadência lenta na negativa" value="${ex?esc(ex.note||''):''}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-acc" onclick="saveExercise('${rid}','${eid||''}')">Salvar</button>
    </div>`);
  setTimeout(()=>document.getElementById('e-name').focus(),100);
}
function saveExercise(rid,eid){
  const r=S.routines.find(x=>x.id===rid);
  const name=document.getElementById('e-name').value.trim();
  if(!name){toast('Qual o exercício? 🤔');return}
  const data={
    name,
    musc:document.getElementById('e-musc').value,
    sets:document.getElementById('e-sets').value.trim()||'1',
    reps:document.getElementById('e-reps').value.trim()||'-',
    load:document.getElementById('e-load').value.trim(),
    rest:document.getElementById('e-rest').value.trim(),
    note:document.getElementById('e-note').value.trim()
  };
  if(eid){Object.assign(r.exercises.find(x=>x.id===eid),data);}
  else{r.exercises.push({id:uid(),...data});}
  save();renderRoutines();closeModal();toast('Exercício salvo ✅');
}
function delExercise(rid,eid){
  const r=S.routines.find(x=>x.id===rid);
  r.exercises=r.exercises.filter(x=>x.id!==eid);
  save();renderRoutines();toast('Exercício removido');
}
function exPR(ex){if(!ex||!ex.history||!ex.history.length)return null;return ex.history.reduce((m,h)=>num(h.load)>num(m.load)?h:m);}
function logSet(rid,eid){
  const r=S.routines.find(x=>x.id===rid);const ex=r.exercises.find(x=>x.id===eid);
  const defReps=(ex.reps||'').match(/\d+/);
  showModal(`<h3>Registrar carga</h3><p class="sub">${esc(ex.name)} · ${esc(r.name)}</p>
    <div class="field"><label>Data</label><input id="ls-date" type="date" value="${today()}"></div>
    <div class="grid2">
      <div class="field"><label>Carga (kg)</label><input id="ls-load" type="number" inputmode="decimal" step="0.5" placeholder="${ex.load||'40'}" value="${ex.load||''}"></div>
      <div class="field"><label>Repetições</label><input id="ls-reps" type="number" inputmode="numeric" placeholder="${defReps?defReps[0]:'10'}" value="${defReps?defReps[0]:''}"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-acc" onclick="saveSet('${rid}','${eid}')">Salvar</button></div>`);
  setTimeout(()=>document.getElementById('ls-load').focus(),100);
}
function saveSet(rid,eid){
  const r=S.routines.find(x=>x.id===rid);const ex=r.exercises.find(x=>x.id===eid);
  const load=num(document.getElementById('ls-load').value);
  if(!load){toast('Coloque a carga 🏋️');return}
  const date=document.getElementById('ls-date').value||today();
  const reps=num(document.getElementById('ls-reps').value)||0;
  if(!ex.history)ex.history=[];
  const prevPR=exPR(ex);
  ex.history.push({date,load:+load.toFixed(1),reps});
  ex.load=String(+load.toFixed(1));
  save();renderRoutines();renderRecords();renderPersonagem();closeModal();
  if(!prevPR||load>num(prevPR.load))toast('🏆 Novo recorde: '+load+' kg! +15 🪙');else toast('Carga registrada ✅');
}

/* ============ RECORDES ============ */
const GOALTYPES=[
  {k:'carga',l:'Bater carga',em:'🏋️'},{k:'peso',l:'Chegar num peso',em:'⚖️'},
  {k:'treinos',l:'Concluir treinos',em:'✅'},{k:'agua',l:'Beber água X dias',em:'💧'},
  {k:'sequencia',l:'Sequência de dias',em:'🔥'}
];
function openGoalForm(type){
  type=type||'carga';
  const exNames=allExerciseNames();let fields='';
  if(type==='carga')fields=`<div class="field"><label>Exercício</label>${exNames.length?`<select id="g-ex">${exNames.map(n=>`<option>${esc(n)}</option>`).join('')}</select>`:`<input id="g-ex" placeholder="Supino reto">`}</div><div class="field"><label>Carga alvo (kg)</label><input id="g-target" type="number" inputmode="decimal" placeholder="100"></div>`;
  else if(type==='peso')fields=`<div class="field"><label>Peso alvo (kg)</label><input id="g-target" type="number" inputmode="decimal" placeholder="${latestWeight()||75}"></div><p class="hint">Perder ou ganhar é definido comparando com seu peso atual (${latestWeight()||'?'} kg).</p>`;
  else if(type==='treinos')fields=`<div class="field"><label>Quantos treinos concluir</label><input id="g-target" type="number" inputmode="numeric" placeholder="50"></div>`;
  else if(type==='agua')fields=`<div class="field"><label>Quantos dias batendo a água</label><input id="g-target" type="number" inputmode="numeric" placeholder="30"></div>`;
  else if(type==='sequencia')fields=`<div class="field"><label>Dias seguidos treinando</label><input id="g-target" type="number" inputmode="numeric" placeholder="10"></div>`;
  showModal(`<h3>Nova meta</h3><p class="sub">Defina um objetivo — ao bater, ganha 100 🪙</p>
    <div class="field"><label>Tipo de meta</label>
      <div class="chip-pick">${GOALTYPES.map(gt=>`<button type="button" class="${gt.k===type?'on':''}" onclick="openGoalForm('${gt.k}')">${gt.em} ${gt.l}</button>`).join('')}</div></div>
    ${fields}
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-acc" onclick="saveGoal('${type}')">Criar meta</button></div>`);
}
function saveGoal(type){
  const target=num(document.getElementById('g-target').value);
  if(!target){toast('Defina o valor alvo');return;}
  const g={id:uid(),type,target,reward:100,created:today()};
  if(type==='carga'){g.exercise=document.getElementById('g-ex').value;g.label=`${g.exercise}: ${target} kg`;}
  else if(type==='peso'){const w=latestWeight()||target;g.start=w;g.dir=target<w?'lose':'gain';g.label=`${g.dir==='lose'?'Emagrecer até':'Chegar a'} ${target} kg`;}
  else if(type==='treinos')g.label=`${target} treinos concluídos`;
  else if(type==='agua')g.label=`Água em dia por ${target} dias`;
  else if(type==='sequencia')g.label=`${target} dias seguidos treinando`;
  S.goals.push(g);save();renderRecords();renderPersonagem();closeModal();toast('Meta criada! 🎯');
}
function delGoal(id){if(!confirm('Apagar esta meta?'))return;S.goals=S.goals.filter(x=>x.id!==id);save();renderRecords();renderPersonagem();toast('Meta removida');}
function exerciseEntries(name){
  const list=[];const n=(name||'').toLowerCase();
  S.routines.forEach(r=>r.exercises.forEach(ex=>{
    if((ex.name||'').toLowerCase()===n&&ex.history)ex.history.forEach(h=>list.push({date:h.date,load:num(h.load),reps:num(h.reps)}));
  }));
  list.sort((a,b)=>a.date.localeCompare(b.date)||a.load-b.load);
  return list;
}
function exMusc(name){let mm='Outro';const n=(name||'').toLowerCase();S.routines.forEach(r=>r.exercises.forEach(ex=>{if((ex.name||'').toLowerCase()===n)mm=ex.musc||mm;}));return mm;}
function delExEntry(name,date,load,reps){
  const n=(name||'').toLowerCase();let done=false;
  S.routines.forEach(r=>r.exercises.forEach(ex=>{
    if(!done&&(ex.name||'').toLowerCase()===n&&ex.history){
      const i=ex.history.findIndex(h=>h.date===date&&num(h.load)===load&&num(h.reps)===reps);
      if(i>=0){ex.history.splice(i,1);done=true;}
    }
  }));
  save();renderRecords();renderRoutines();renderPersonagem();
  if(exerciseEntries(name).length)exerciseDetail(name);else closeModal();
  toast('Registro removido');
}
function exerciseDetail(name){
  const entries=exerciseEntries(name);
  if(!entries.length){toast('Sem registros ainda');return;}
  const musc=exMusc(name);
  const pr=entries.reduce((m,e)=>e.load>m.load?e:m,entries[0]);
  const first=entries[0],last=entries[entries.length-1];
  const e1rm=pr.reps?Math.round(pr.load*(1+pr.reps/30)):null;
  const diff=+(last.load-first.load).toFixed(1);
  const chart=svgChart(entries.map(e=>({date:e.date,v:e.load})),'#ff9f43','det');
  showModal(`<h3>${esc(name)}</h3><p class="sub">${esc(musc)} · ${entries.length} registro${entries.length>1?'s':''} de carga</p>
    <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr">
      <div class="stat"><div class="v">${pr.load}<small style="font-size:11px"> kg</small></div><div class="l">Recorde</div></div>
      <div class="stat"><div class="v">${e1rm||'–'}</div><div class="l">1RM est.</div></div>
      <div class="stat"><div class="v" style="color:${diff>=0?'var(--acc)':'var(--warn)'}">${diff>=0?'+':''}${diff}</div><div class="l">Evolução kg</div></div>
    </div>
    ${chart?`<div class="chart-wrap">${chart}</div>`:'<div class="hint">Registre em pelo menos 2 dias pra ver o gráfico de progressão.</div>'}
    <div style="font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;margin:14px 0 8px">Todos os registros</div>
    ${[...entries].reverse().map(e=>{const est=e.reps?Math.round(e.load*(1+e.reps/30)):null;const isPR=e.load===pr.load;return `<div class="row">
      <div class="name"><b>${e.load} kg × ${e.reps||'–'}</b><span>${dShort(e.date)}${est?' · 1RM ~'+est+'kg':''}${isPR?' · 🏆':''}</span></div>
      <div class="row-actions"><button class="mini del" onclick="delExEntry('${escAttr(name)}','${e.date}',${e.load},${e.reps})">🗑</button></div>
    </div>`;}).join('')}
    <div class="modal-actions"><button class="btn btn-acc" style="flex:1;justify-content:center" onclick="closeModal()">Fechar</button></div>`);
}
function renderRecords(){

      <div style="font-size:11.5px;color:var(--mut);margin-top:5px">${(''+pr.cur)} / ${pr.target} ${pr.unit} · ${pr.done?'concluída · +'+(g.reward||100)+' 🪙':pr.pct+'%'}</div>
    </div>`;}).join(''):'<div style="color:var(--mut);font-size:13px;margin-top:11px">Sem metas ainda. Defina um objetivo (ex: 100 kg no supino, água por 30 dias, emagrecer 5 kg) e ganhe moedas ao bater 🎯</div>'}
  </div>`;
  // CONQUISTAS
  const achHTML=`<div class="card">
    <b style="font-size:15px">🏅 Conquistas</b>
    <div style="color:var(--mut);font-size:12px;margin:2px 0 12px">${achUnlocked}/${ACHIEVEMENTS.length} desbloqueadas</div>
    <div class="ach-grid">
      ${ACHIEVEMENTS.map(a=>{const on=a.f(ctx);return `<div class="ach ${on?'on':''}">
        <div class="ach-em">${on?a.em:'🔒'}</div><div class="ach-n">${esc(a.n)}</div>
        <div class="ach-r">${on?'✓ +'+a.r+' 🪙':esc(a.d)}</div></div>`;}).join('')}

  const map={};

  items.forEach(it=>{it.hist.sort((a,b)=>a.date.localeCompare(b.date));it.pr=it.hist.reduce((m,h)=>num(h.load)>num(m.load)?h:m);});
  items.sort((a,b)=>a.musc.localeCompare(b.musc)||num(b.pr.load)-num(a.pr.load));
  const recHTML=`<div style="font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;margin:6px 4px 10px">🏆 Recordes por exercício</div>`+(items.length?items.map((it,i)=>{
    const e1rm=it.pr.reps?Math.round(num(it.pr.load)*(1+it.pr.reps/30)):null;
    const chart=svgChart(it.hist.map(h=>({date:h.date,v:num(h.load)})),'#ff9f43','r'+i);

      <div style="color:var(--mut);font-size:12px">PR em ${dShort(it.pr.date)}${e1rm?` · 1RM estimado ~${e1rm} kg`:''} · ${it.hist.length} registro${it.hist.length>1?'s':''} · toque pra ver progressão →</div>
      ${chart?`<div class="chart-wrap">${chart}</div>`:''}</div>`;
  }).join(''):'<div class="card" style="text-align:center;color:var(--mut);font-size:13px">Registre a carga de um exercício (botão 📈 na aba Treino) que o PR aparece aqui 🏋️</div>');
  body.innerHTML=metasHTML+achHTML+recHTML;
}

/* ============ ALIMENTAÇÃO ============ */
function mealTotals(m){
  return m.foods.reduce((a,f)=>({
    kcal:a.kcal+num(f.kcal),prot:a.prot+num(f.prot),
    carb:a.carb+num(f.carb),fat:a.fat+num(f.fat)
  }),{kcal:0,prot:0,carb:0,fat:0});
}
function dayTotals(){
  return S.meals.reduce((a,m)=>{const t=mealTotals(m);return{
    kcal:a.kcal+t.kcal,prot:a.prot+t.prot,carb:a.carb+t.carb,fat:a.fat+t.fat
  }},{kcal:0,prot:0,carb:0,fat:0});
}
const R=n=>Math.round(n);
function renderDieta(){
  const t=dayTotals(),g=S.targets;
  document.getElementById('dieta-sub').textContent=`${R(t.kcal)} / ${g.kcal} kcal hoje`;
  const barRow=(lbl,cls,val,goal,unit,color)=>{
    const pct=goal>0?Math.min(100,Math.round(val/goal*100)):0;
    return `<div class="macro-box ${cls}">
      <div class="lbl">${lbl}</div>
      <div class="val">${R(val)}<small>/${goal}${unit}</small></div>
      <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
    </div>`;
  };
  document.getElementById('macro-summary').innerHTML=`
    <div class="card macro-card">
      <div style="display:flex;align-items:center;justify-content:space-between">

        <span style="color:var(--mut);font-size:12px">metas diárias</span>
      </div>
      <div class="macro-grid">
        ${barRow('Calorias','kcal',t.kcal,g.kcal,'','linear-gradient(90deg,#c6ff3a,#9cff00)')}
        ${barRow('Proteína','prot',t.prot,g.prot,'g','#4aa8ff')}
        ${barRow('Carbo','carb',t.carb,g.carb,'g','#ffb13a')}

    const foods=m.foods.map(f=>`
      <div class="row">
        <div class="name"><b>${esc(f.name)}</b>
          ${f.qty?`<span>${esc(f.qty)}</span>`:''}</div>
        <div class="pills">
          <span class="pill">${R(num(f.kcal))} kcal</span>
          ${num(f.prot)?`<span class="pill" style="color:var(--prot)">P ${R(num(f.prot))}</span>`:''}
          ${num(f.carb)?`<span class="pill" style="color:var(--carb)">C ${R(num(f.carb))}</span>`:''}
          ${num(f.fat)?`<span class="pill" style="color:var(--fat)">G ${R(num(f.fat))}</span>`:''}
        </div>
        <div class="row-actions">
          <button class="mini" onclick="openFood('${m.id}','${f.id}')">✏️</button>
          <button class="mini del" onclick="delFood('${m.id}','${f.id}')">🗑</button>
        </div>
      </div>`).join('');
    return `<div class="card">
      <div class="routine-head">

        <button class="mini" onclick="renameMeal('${m.id}')">✏️</button>

      </div>
      <div class="meal-total">
        <span class="pill">${R(t.kcal)} kcal</span>
        <span class="pill" style="color:var(--prot)">P ${R(t.prot)}g</span>
        <span class="pill" style="color:var(--carb)">C ${R(t.carb)}g</span>
        <span class="pill" style="color:var(--fat)">G ${R(t.fat)}g</span>
      </div>
      ${foods||'<div class="routine-meta">Sem alimentos ainda.</div>'}
      <div class="add-line" style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="openFood('${m.id}')">＋ Alimento</button>
        <button class="btn btn-ghost btn-sm" onclick="mealSuggest('${m.id}')">💡 Sugestões</button>
      </div>
    </div>`;
  }).join('');
}

function reviewDiet(){
  const anyFood=S.meals.some(m=>m.foods.length);
  if(!anyFood){showModal(`<h3>🔍 Revisão da dieta</h3><p class="sub"></p>
    <div class="why">Você ainda não adicionou alimentos. Monte suas refeições (pode usar as 💡 Sugestões) e volte que eu analiso pra você 🍽️</div>
    <div class="modal-actions"><button class="btn btn-acc" style="flex:1;justify-content:center" onclick="closeModal()">Ok</button></div>`);return;}
  const pl=dayTotals(),t=S.targets;
  const kdiff=t.kcal?(pl.kcal-t.kcal)/t.kcal:0,absk=Math.abs(kdiff);
  const verdict=absk>0.30?'Tá bem fora da meta 😅':absk>0.12?'Quase lá, dá pra ajustar':'Tá coerente com sua meta! 👏';
  const msgs=[];
  if(kdiff>0.12)msgs.push(`Você tem <b>${Math.round(pl.kcal)} kcal</b> planejadas, ~${Math.round(kdiff*100)}% acima da meta (${t.kcal}). Vale reduzir um pouco.`);
  else if(kdiff<-0.12)msgs.push(`Você tem <b>${Math.round(pl.kcal)} kcal</b>, ~${Math.round(-kdiff*100)}% abaixo da meta (${t.kcal}). Se o objetivo é ganhar, tá comendo pouco.`);
  else msgs.push(`Calorias batendo a meta (${Math.round(pl.kcal)} / ${t.kcal} kcal). Mandou bem 👌`);
  if(pl.prot<t.prot*0.85)msgs.push(`Proteína um pouco baixa: <b>${Math.round(pl.prot)}g</b> de ${t.prot}g. Ela sustenta o músculo — tente chegar mais perto da meta.`);
  else msgs.push(`Proteína ok: ${Math.round(pl.prot)}g (meta ${t.prot}g) 💪`);
  if(pl.fat>t.fat*1.35)msgs.push(`Gordura alta: <b>${Math.round(pl.fat)}g</b> vs ${t.fat}g. Gordura tem mais que o dobro de calorias por grama — reduzir ajuda a bater a meta sem passar fome.`);
  let carbOpts='';
  if(kdiff>0.08||pl.carb>t.carb*1.2){
    const carbHit=Math.max(0,Math.round((t.kcal-pl.prot*4-pl.fat*9)/4));
    const mid=Math.round((pl.carb+carbHit)/2);
    const opts=[{l:'Enxuto',g:carbHit,d:'bate a meta calórica'},{l:'Meio-termo',g:mid,d:'redução suave'},{l:'Manter',g:Math.round(pl.carb),d:'como está hoje'}];
    carbOpts=`<div style="font-size:12px;color:var(--acc);font-weight:800;text-transform:uppercase;margin:8px 0 8px">🍚 3 opções de carboidrato — você escolhe</div>
      ${opts.map(o=>{const kc=Math.round(pl.prot*4+pl.fat*9+o.g*4);return `<div class="opt" style="cursor:default">
        <div class="o-main"><div class="o-name">${o.l} · ${o.g}g de carbo</div><div class="o-sub">${o.d} · total ~${kc} kcal</div></div></div>`;}).join('')}
      <div class="hint" style="margin-bottom:4px">Referências pra você ajustar as refeições. A escolha é sempre sua.</div>`;
  }
  showModal(`<h3>🔍 ${verdict}</h3>
    <p class="sub">Planejado: ${Math.round(pl.kcal)} kcal · P ${Math.round(pl.prot)} · C ${Math.round(pl.carb)} · G ${Math.round(pl.fat)}g</p>
    ${msgs.map(m=>`<div class="why" style="margin:0 0 9px">💡 ${m}</div>`).join('')}
    ${carbOpts}
    <div class="modal-actions"><button class="btn btn-acc" style="flex:1;justify-content:center" onclick="closeModal()">Entendi</button></div>`);
}

const CATLABEL={cafe:'Café da manhã',almoco:'Almoço',lanche:'Lanche',janta:'Jantar'};
function detectCat(name){const n=(name||'').toLowerCase();
  if(/caf|manh/.test(n))return'cafe';if(/almo/.test(n))return'almoco';
  if(/lanch|pré|pre|ceia|tarde/.test(n))return'lanche';if(/jant|noite/.test(n))return'janta';return'';}
function comboAllowed(c){
  const r=(S.profile&&S.profile.restrictions)||[];
  if(r.includes('lactose')&&c.tags.lac)return false;
  if(r.includes('gluten')&&c.tags.glu)return false;
  if(r.includes('vegetariano')&&c.tags.meat)return false;
  if(r.includes('vegano')&&(c.tags.meat||c.tags.lac||c.tags.egg))return false;
  return true;
}
function comboTotals(c){return c.foods.reduce((a,f)=>({k:a.k+f.kcal,p:a.p+f.prot,cb:a.cb+f.carb,ft:a.ft+f.fat}),{k:0,p:0,cb:0,ft:0});}
function mealSuggest(mid){
  const m=S.meals.find(x=>x.id===mid);const cat=detectCat(m.name);
  let idxs=COMBOS.map((c,i)=>i).filter(i=>(!cat||COMBOS[i].cat===cat)&&comboAllowed(COMBOS[i]));
  if(!idxs.length)idxs=COMBOS.map((c,i)=>i).filter(i=>comboAllowed(COMBOS[i]));
  const r=(S.profile&&S.profile.restrictions)||[];
  showModal(`
    <h3>Sugestões${cat?' de '+CATLABEL[cat].toLowerCase():''}</h3>
    <p class="sub">${esc(m.name)} · toque pra adicionar tudo e depois edite o que quiser${r.length?' · filtrado p/ suas restrições':''}</p>
    ${idxs.map(i=>{const c=COMBOS[i],t=comboTotals(c);return `
      <div class="opt" style="cursor:pointer;align-items:flex-start" onclick="addCombo('${mid}',${i})">
        <div class="radio" style="border-radius:8px;border:none;background:var(--acc);color:#0a0a0a;font-weight:900;margin-top:2px">＋</div>
        <div class="o-main"><div class="o-name">${esc(c.name)}</div>
          <div class="o-sub">${c.foods.map(f=>esc(f.name)).join(' · ')}</div>
          <div class="meal-total" style="margin-top:7px">
            <span class="pill">${Math.round(t.k)} kcal</span>
            <span class="pill" style="color:var(--prot)">P ${Math.round(t.p)}g</span>
            <span class="pill" style="color:var(--carb)">C ${Math.round(t.cb)}g</span>
            <span class="pill" style="color:var(--fat)">G ${Math.round(t.ft)}g</span>

}
function addCombo(mid,i){
  const m=S.meals.find(x=>x.id===mid);const c=COMBOS[i];

const LIFE=[

  {k:'mod',label:'Moderado',pal:1.40,d:'em pé / andando'},

];
const goalLabel=k=>(GOALS.find(g=>g.k===k)||{}).label||'—';

function computeMetrics(p){
  const W=num(p.weight),H=num(p.height),A=num(p.age);
  const bmr=p.sex==='F'?(10*W+6.25*H-5*A-161):(10*W+6.25*H-5*A+5);
  const basePal=(LIFE.find(l=>l.k===p.lifestyle)||{pal:1.30}).pal;
  const sessions=num(p.trainDays)+num(p.otherDays);
  // acréscimo modesto por sessão de treino (~0,04), com teto p/ não estourar a faixa validada (máx 1,80)
  const palAdd=Math.min(sessions*0.04,0.25);
  const pal=Math.min(basePal+palAdd,1.80);
  return {W,bmr:Math.round(bmr),pal:+pal.toFixed(2),tdee:Math.round(bmr*pal),sessions,basePal};
}
function gcat(g){if(g==='perder'||g==='definir')return'cut';if(g==='massa'||g==='peso')return'bulk';return'perf';}
const r10=v=>Math.round(v/10)*10;
function calorieOptions(tdee,goal){
  const c=gcat(goal);
  if(c==='cut')return[
    {key:'a',label:'Déficit leve',sub:'−10% · preserva massa magra',kcal:r10(tdee*0.90),rec:goal==='definir'?35:30},
    {key:'b',label:'Déficit moderado',sub:'−20% · ritmo equilibrado',kcal:r10(tdee*0.80),rec:45},
    {key:'c',label:'Déficit agressivo',sub:'−25% · rápido, risco de perder massa',kcal:r10(tdee*0.75),rec:goal==='definir'?20:25}];
  if(c==='bulk')return[
    {key:'a',label:'Superávit limpo',sub:'+5% · ganho mais magro',kcal:r10(tdee*1.05),rec:goal==='massa'?50:35},
    {key:'b',label:'Superávit moderado',sub:'+10% · equilíbrio massa/gordura',kcal:r10(tdee*1.10),rec:35},
    {key:'c',label:'Superávit alto',sub:'+15% · ganha rápido, mais gordura',kcal:r10(tdee*1.15),rec:goal==='massa'?15:30}];
  return[
    {key:'a',label:'Manutenção',sub:'≈ seu gasto · recomposição',kcal:r10(tdee),rec:35},
    {key:'b',label:'Leve superávit',sub:'+8% · suporta força e performance',kcal:r10(tdee*1.08),rec:45},
    {key:'c',label:'Leve déficit',sub:'−8% · enxuga mantendo o treino',kcal:r10(tdee*0.92),rec:20}];
}
function proteinOptions(W,goal){
  const c=gcat(goal);
  const recs=c==='cut'?{a:15,b:35,c:50}:c==='bulk'?{a:25,b:50,c:25}:{a:30,b:45,c:25};
  const labels={a:'Base eficaz',b:'Recomendado geral',c:'Alta (cutting/avançado)'};
  return[1.6,1.9,2.2].map((gkg,i)=>{const key='abc'[i];return{key,gkg,g:Math.round(W*gkg),rec:recs[key],label:labels[key]};});
}
function fatOptions(W,goal){
  const recs={a:30,b:50,c:20};
  const labels={a:'Mínimo saudável',b:'Equilibrado',c:'Mais gordura, menos carbo'};
  return[0.8,1.0,1.2].map((gkg,i)=>{const key='abc'[i];return{key,gkg,g:Math.round(W*gkg),rec:recs[key],label:labels[key]};});
}
function applyChoices(){
  const p=S.profile;if(!p)return;
  const m=computeMetrics(p);
  const cO=calorieOptions(m.tdee,p.goal),pO=proteinOptions(m.W,p.goal),fO=fatOptions(m.W,p.goal);
  let kcal,prot,fat;
  if(S.choices.kcal==='custom'&&S.choices.kcalCustom)kcal=S.choices.kcalCustom;
  else kcal=(cO.find(o=>o.key===S.choices.kcal)||cO[1]).kcal;
  if(S.choices.prot==='custom'&&S.choices.protCustom)prot=S.choices.protCustom;
  else prot=(pO.find(o=>o.key===S.choices.prot)||pO[1]).g;
  if(S.choices.fat==='custom'&&S.choices.fatCustom)fat=S.choices.fatCustom;
  else fat=(fO.find(o=>o.key===S.choices.fat)||fO[1]).g;
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  S.targets={kcal,prot,carb,fat};save();
}
function pickOpt(type,key){S.choices[type]=key;applyChoices();renderPerfil();renderDieta();}

function saveCustomMacro(type){
  const v=Math.round(num(document.getElementById('cm').value));

      {key:'b',name:'ABCDEF',sub:'6 grupos divididos',rec:30,sk:[mk('A','Peito'),mk('B','Costas'),mk('C','Pernas'),mk('D','Ombro'),mk('E','Braços'),mk('F','Posterior e Core')]},

    ]

function chipRow(name,arr,sel,keyField,labelField){

    return `<button type="button" data-g="${name}" data-k="${k}" class="${sel===k?'on':''}" onclick="chipPick(this)">${l}</button>`;
  }).join('')}</div>`;
}
function chipPick(btn){

  document.querySelectorAll('[data-g="'+g+'"]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

/* ============ REVISÃO DE TREINO ============ */
function reviewWorkout(){
  const exs=[];S.routines.forEach(r=>r.exercises.forEach(e=>exs.push(e)));
  if(!exs.length){
    showModal(`<h3>🔍 Revisão do treino</h3><p class="sub"></p>
      <div class="why">Você ainda não tem exercícios cadastrados. Monte seu treino na aba Treino e volte aqui que eu analiso o equilíbrio pra você 💪</div>
      <div class="modal-actions"><button class="btn btn-acc" style="flex:1;justify-content:center" onclick="closeModal();go('treino')">Ir pro treino</button></div>`);
    return;
  }
  const sets={},cnt={};
  exs.forEach(e=>{const g=e.musc||'Outro';const s=num(e.sets)||1;sets[g]=(sets[g]||0)+s;cnt[g]=(cnt[g]||0)+1;});
  const major=['Peito','Costas','Pernas','Ombro'];
  const push=(sets['Peito']||0)+(sets['Ombro']||0)+(sets['Tríceps']||0);
  const pull=(sets['Costas']||0)+(sets['Bíceps']||0);
  const rid=S.routines[0].id;
  const leastMajor=()=>major.slice().sort((a,b)=>(sets[a]||0)-(sets[b]||0))[0];
  const msgs=[]; // {t, g?}
  major.forEach(g=>{if(!sets[g])msgs.push({t:`Não vi nada de <b>${g}</b> — vale incluir pra não deixar esse grupo pra trás.`,g});});
  // muitos exercícios do mesmo grupo (ativação parecida)
  Object.keys(cnt).forEach(g=>{if(cnt[g]>=5){const alt=leastMajor();
    msgs.push({t:`Você colocou <b>${cnt[g]} exercícios de ${g}</b> — bastante coisa com ativação muscular parecida. Você pode, mas considere trocar alguns por outro grupo${alt&&alt!==g?` (ex: <b>${alt}</b>)`:''} em vez de tantos movimentos iguais.`,g:(alt&&alt!==g)?alt:null});}});
  // movimentos repetidos (mesma palavra base, ex: vários "supino")
  const baseCount={};
  exs.forEach(e=>{const w=(e.name||'').toLowerCase().split(/[ (/]/)[0];if(w.length>=4){(baseCount[w]=baseCount[w]||[]).push(e.name);}});
  Object.keys(baseCount).forEach(w=>{if(baseCount[w].length>=3)msgs.push({t:`Você tem <b>${baseCount[w].length} variações de "${w}"</b> (movimento bem parecido). Variar o padrão — outro ângulo, pegada ou grupo — rende mais do que repetir o mesmo.`});});
  // volume por grupo
  major.forEach(g=>{const s=sets[g]||0;if(s>0&&s<8)msgs.push({t:`<b>${g}</b> está com ${s} séries no total — um pouco baixo. A faixa que costuma render é ~10–20 séries/semana.`,g});
    if(s>25)msgs.push({t:`<b>${g}</b> tem ${s} séries — bastante volume. Cuidado pra não atrapalhar a recuperação dos outros grupos.`});});
  // empurrar x puxar
  if(push>0&&pull>0){
    if(push>pull*1.5)msgs.push({t:`Bem mais <b>empurrar</b> (peito/ombro/tríceps: ${push} séries) do que <b>puxar</b> (costas/bíceps: ${pull}). Equilibrar com mais costas ajuda postura e simetria.`,g:'Costas'});
    if(pull>push*1.5)msgs.push({t:`Mais <b>puxar</b> (${pull}) do que <b>empurrar</b> (${push}) — pode reforçar peito/ombro.`,g:'Peito'});
  }
  // séries demais num exercício só
  exs.forEach(e=>{if((num(e.sets)||0)>=6)msgs.push({t:`<b>${esc(e.name)}</b> está com ${e.sets} séries num exercício só. Que tal dividir em 2 movimentos diferentes (ex: um mais clavicular) pra variar o estímulo?`});});
  // peito clavicular
  if((cnt['Peito']||0)>=2){const peitoEx=exs.filter(e=>e.musc==='Peito').map(e=>e.name.toLowerCase()).join(' ');
    if(!/inclinad|clavicular|superior|45/.test(peitoEx))msgs.push({t:`Seu peito parece focar a porção central/baixa. Um <b>inclinado</b> (porção clavicular) deixa o peitoral mais completo.`,g:'Peito'});}
  // progressão
  const created=S.routines.map(r=>r.created).filter(Boolean);
  if(created.length){const weeks=Math.floor((Date.now()-Math.min(...created))/(7*864e5));
    if(weeks>=6)msgs.push({t:`Seu treino tem ~${weeks} semanas. Costuma valer a pena <b>variar a cada 6–10 semanas</b> pra continuar evoluindo — pode ser hora de mexer.`});}
  if(!msgs.length)msgs.push({t:'Treino bem equilibrado entre os grupos! 👏 Continue acompanhando as cargas pra garantir a progressão.'});

  const totalSets=Object.values(sets).reduce((a,b)=>a+b,0);
  const dist=Object.keys(sets).sort((a,b)=>sets[b]-sets[a]).map(g=>`<span class="pill">${g}: ${sets[g]}</span>`).join(' ');
  showModal(`<h3>🔍 Revisão do treino</h3>
    <p class="sub">${exs.length} exercícios · ${totalSets} séries no total. São sugestões — você aceita ou ignora, a decisão é sua 💪</p>
    <div style="margin-bottom:14px"><div style="font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;margin-bottom:7px">Séries por grupo</div>
      <div class="pills">${dist}</div></div>
    ${msgs.map(mo=>`<div class="why" style="margin:0 0 9px">💡 ${mo.t}${mo.g?`<div style="margin-top:9px"><button class="btn btn-acc btn-sm" onclick="closeModal();suggestExercises('${rid}','${mo.g}')">✓ Aceitar: ver exercícios de ${mo.g.toLowerCase()}</button></div>`:''}</div>`).join('')}
    <div class="modal-actions"><button class="btn btn-acc" style="flex:1;justify-content:center" onclick="closeModal()">Fechar</button></div>`);
}

const GRP_SYN={'quadríceps':'Pernas','glúteo':'Pernas','posterior':'Pernas','coxa':'Pernas','panturrilha':'Pernas',
  'braços':'Bíceps','push':'Peito','pull':'Costas','superior':'Peito','inferior':'Pernas','corpo todo':'Peito'};
function focusGroups(focus){
  const f=(focus||'').toLowerCase();const found=[];
  Object.keys(EXLIB).forEach(g=>{if(f.includes(g.toLowerCase()))found.push(g);});
  Object.keys(GRP_SYN).forEach(s=>{if(f.includes(s)&&!found.includes(GRP_SYN[s]))found.push(GRP_SYN[s]);});
  return found.length?found:Object.keys(EXLIB);
}
const gradeStars=g=>'★'.repeat(g)+'<span style="color:var(--line)">'+'★'.repeat(3-g)+'</span>';
const gradeLabel=g=>g===3?'Muito recomendado':g===2?'Recomendado':'Complementar';

const escAttr=s=>(s||'').replace(/'/g,"\\'");
function recommendedNext(r){
  const groups=focusGroups(r.focus);
  const have=new Set(r.exercises.map(e=>e.name));
  const added={};r.exercises.forEach(e=>{added[e.musc]=(added[e.musc]||0)+1;});
  const cands=[];
  groups.forEach((g,gi)=>{(EXLIB[g]||[]).forEach(ex=>{if(!have.has(ex.n))
    cands.push({g,ex,score:ex.g*10+(ex.c?3:0)-(added[g]||0)*4-gi*5});});});
  cands.sort((a,b)=>b.score-a.score);
  return cands;
}
function exItemHTML(rid,group,ex,reopen,showGroup){
  return `<div class="opt" style="cursor:pointer" onclick="addSuggested('${rid}','${group}','${escAttr(ex.n)}','${reopen}')">
    <div class="radio" style="border-radius:8px;border:none;background:var(--acc);color:#0a0a0a;font-weight:900">＋</div>
    <div class="o-main"><div class="o-name">${esc(ex.n)}${showGroup?` <span class="pill dim">${group}</span>`:''}</div>
      <div class="o-sub"><span style="color:var(--orange);letter-spacing:1px">${gradeStars(ex.g)}</span> · ${gradeLabel(ex.g)} · ${ex.c?'composto':'isolado'} · ${ex.reps}</div></div>
  </div>`;
}
function suggestExercises(rid,group){
  const r=S.routines.find(x=>x.id===rid);if(!r)return;
  const groups=focusGroups(r.focus);
  const g=group||groups[0]||'Peito';
  const have=new Set(r.exercises.map(e=>e.name));
  const rec=recommendedNext(r).slice(0,4);
  const list=(EXLIB[g]||[]).slice().sort((a,b)=>b.g-a.g).filter(ex=>!have.has(ex.n));
  const allGroups=Object.keys(EXLIB);
  const recHtml=rec.length?`
    <div style="font-size:12px;color:var(--acc);font-weight:800;text-transform:uppercase;margin:2px 0 8px">⭐ Próximos sugeridos pro treino</div>
    ${rec.map(c=>exItemHTML(rid,c.g,c.ex,g,true)).join('')}
    <div style="font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;margin:16px 0 9px">Explorar por grupo</div>`:'';
  showModal(`
    <h3>Montar ${esc(r.name)}</h3>
    <p class="sub">Foco: ${esc(r.focus||groups.join(', '))} · as sugestões mudam conforme você adiciona, pra fechar o treino</p>
    ${recHtml}
    <div class="chip-pick" style="margin-bottom:14px">
      ${allGroups.map(x=>`<button type="button" class="${x===g?'on':''}" onclick="suggestExercises('${rid}','${x}')">${x}</button>`).join('')}
    </div>
    ${list.length?list.map(ex=>exItemHTML(rid,g,ex,g,false)).join(''):'<div class="routine-meta">Todos os exercícios de '+esc(g.toLowerCase())+' já estão no treino 💪</div>'}
    <div class="modal-actions"><button class="btn btn-acc" style="flex:1;justify-content:center" onclick="closeModal()">Concluir</button></div>`);
}
function addSuggested(rid,group,name,reopen){
  const r=S.routines.find(x=>x.id===rid);
  const ex=(EXLIB[group]||[]).find(e=>e.n===name);
  if(!ex){toast('Exercício não encontrado');return;}
  if(r.exercises.some(e=>e.name===ex.n)){toast('Já está no treino 😉');return;}
  r.exercises.push({id:uid(),name:ex.n,musc:group,sets:ex.c?'4':'3',reps:ex.reps,load:'',rest:ex.c?'120':'75',note:'',history:[]});
  save();renderRoutines();toast(ex.n+' adicionado ✅');
  suggestExercises(rid,reopen||group);
}

  r.exercises.forEach((ex,i)=>{

  {k:'quadril',label:'Quadril'},{k:'coxa',label:'Coxa'},{k:'panturrilha',label:'Panturrilha'}
];
let measSel='braco';
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dShort(s){const p=s.split('-');return p[2]+'/'+p[1];}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}

function svgChart(series,color,id){
  if(series.length<2)return null;
  const W=320,H=132,pL=6,pR=6,pT=14,pB=20;
  const vals=series.map(s=>s.v);let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mn===mx){mn-=1;mx+=1;}const rg=mx-mn,n=series.length;
  const X=i=>pL+(i/(n-1))*(W-pL-pR);
  const Y=v=>pT+(1-(v-mn)/rg)*(H-pT-pB);
  const pts=series.map((s,i)=>`${X(i).toFixed(1)},${Y(s.v).toFixed(1)}`).join(' ');
  const area=`${pL},${H-pB} ${pts} ${(W-pR)},${H-pB}`;
  const dots=series.map((s,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(s.v).toFixed(1)}" r="${i===n-1?4:2.5}" fill="${i===n-1?color:'#0d0f12'}" stroke="${color}" stroke-width="2"/>`).join('');
  const last=series[n-1];
  const lx=Math.min(X(n-1),W-30);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity="0.28"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#g${id})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${lx}" y="${(Y(last.v)-8).toFixed(1)}" fill="${color}" font-size="12" font-weight="800" text-anchor="middle">${last.v}</text>
    <text x="${pL}" y="${H-6}" fill="#8b95a3" font-size="10">${dShort(series[0].date)}</text>
    <text x="${W-pR}" y="${H-6}" fill="#8b95a3" font-size="10" text-anchor="end">${dShort(last.date)}</text>
  </svg>`;
}

function computeStreak(pred){
  const days=S.progress.days;let d=new Date(today());
  // se hoje não bateu, começa de ontem
  const key=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  if(!(days[key(d)]&&pred(days[key(d)])))d.setDate(d.getDate()-1);
  let c=0;
  while(days[key(d)]&&pred(days[key(d)])){c++;d.setDate(d.getDate()-1);}
  return c;
}

function maxLoadForExercise(name){let mx=0;const n=(name||'').toLowerCase();
  S.routines.forEach(r=>r.exercises.forEach(ex=>{if((ex.name||'').toLowerCase()===n&&ex.history)ex.history.forEach(h=>{if(num(h.load)>mx)mx=num(h.load);});}));return mx;}
function allExerciseNames(){const s=new Set();S.routines.forEach(r=>r.exercises.forEach(ex=>s.add(ex.name)));return[...s];}
function latestWeight(){const a=[...(S.progress.weight||[])].sort((x,y)=>x.date.localeCompare(y.date));return a.length?a[a.length-1].v:(S.profile?num(S.profile.weight):0);}
function countDays(pred){let c=0;const days=S.progress.days||{};for(const k in days)if(pred(days[k]))c++;return c;}
function waterDaysCount(){const g=S.progress.waterGoalMl||2000;return countDays(d=>{const ml=d.waterMl!=null?d.waterMl:(d.water||0)*200;return ml>=g&&ml>0;});}
function goalProgress(g){
  if(g.type==='carga'){const cur=maxLoadForExercise(g.exercise);return{cur,target:g.target,done:cur>=g.target,unit:'kg',pct:g.target?Math.min(100,Math.round(cur/g.target*100)):0};}
  if(g.type==='peso'){const w=latestWeight(),start=g.start||w;let done,pct;
    if(g.dir==='lose'){done=w<=g.target;pct=start>g.target?Math.round((start-w)/(start-g.target)*100):100;}
    else{done=w>=g.target;pct=g.target>start?Math.round((w-start)/(g.target-start)*100):100;}
    return{cur:w,target:g.target,done,unit:'kg',pct:Math.max(0,Math.min(100,pct))};}
  if(g.type==='agua'){const c=waterDaysCount();return{cur:c,target:g.target,done:c>=g.target,unit:'dias',pct:g.target?Math.min(100,Math.round(c/g.target*100)):0};}
  if(g.type==='treinos'){const c=countDays(d=>d.workout);return{cur:c,target:g.target,done:c>=g.target,unit:'treinos',pct:g.target?Math.min(100,Math.round(c/g.target*100)):0};}
  if(g.type==='sequencia'){const c=computeStreak(d=>d.workout);return{cur:c,target:g.target,done:c>=g.target,unit:'dias',pct:g.target?Math.min(100,Math.round(c/g.target*100)):0};}
  return{cur:0,target:g.target,done:false,unit:'',pct:0};
}
